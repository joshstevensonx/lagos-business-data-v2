pipeline: magazine
run_id_prefix: magazine
areas: [Anthony / Anthony Village, Maryland / Mende, Ilupeju, Gbagada, Obanikoro, Palmgrove, Ojota]
core_areas: [Anthony / Anthony Village, Maryland / Mende]
taxonomy: {mode: full_tree, terms: null}
sources:
  places_api: {enabled: false, monthly_ceiling_pct: 80, skus: [essentials]}
  osm: {enabled: true, via_browser: false, bbox_pad_km: 2.0}
  gmaps_browser:
    enabled: true
    concurrency: 3
    zoom: 14
    max_searches: 400
    max_runtime_minutes: 240
    delay_seconds: [2, 6]
    sweeps:
      - {center: [6.5660, 3.3680], zoom: 14, covers: [Anthony / Anthony Village, Maryland / Mende]}
      - {center: [6.5480, 3.3770], zoom: 14, covers: [Ilupeju, Gbagada, Obanikoro, Palmgrove, Ojota]}
  directories:
    enabled: true
    sites: [finelib, ngex, cybo, businesslist]
    rate_per_second: 1.0
    max_pages: 5
    contact_email: "ops@nexora.example"
    pages:
      finelib:
        - {url: "https://www.finelib.com/cities/lagos/areas-and-suburbs/anthony-village", area: "Anthony / Anthony Village", term: "directory listings"}
        - {url: "https://www.finelib.com/cities/lagos/areas-and-suburbs/maryland", area: "Maryland / Mende", term: "directory listings"}
  site_contacts: {enabled: true, max_sites: 1500, concurrency: 5}
enrich:
  place_pages: {enabled: false, max_place_visits: 500, order_by: reviews_desc}
output: {dir: out/, workbook: Anthony_Community_Media_MASTER_DATABASE_v4.xlsx}
