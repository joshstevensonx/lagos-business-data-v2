[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagosdata"
version = "0.1.0"
description = "Resumable Lagos local business data pipeline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7", "typer>=0.12", "PyYAML>=6", "httpx>=0.27",
  "selectolax>=0.3", "playwright>=1.45", "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lagosdata = "lagosdata.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
